{% extends "admin.html" %}

{% block title %}Staff Profiles{% endblock %}
{% block page_title %}Staff Profiles{% endblock %}

{% block content %}

<style>

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
    gap:16px;
}

.card{
    background:var(--surface);
    border-radius:var(--radius-lg);
    padding:18px;
    border:1px solid var(--border);
    box-shadow:var(--shadow-sm);
    text-align:center;
    transition:0.2s;
}

.card:hover{
    transform:translateY(-3px);
    box-shadow:var(--shadow-md);
}

.card img{
    width:80px;
    height:80px;
    border-radius:50%;
    object-fit:cover;
    margin-bottom:10px;
    border:2px solid var(--border);
}

.card h3{
    font-size:16px;
    margin-bottom:6px;
    color:var(--ink-900);
}

.card p{
    font-size:13px;
    color:var(--ink-500);
    margin:2px 0;
}

.btns{
    margin-top:10px;
    display:flex;
    gap:6px;
    justify-content:center;
}

.btn{
    padding:8px 11px;
    border:none;
    border-radius:8px;
    font-size:12px;
    cursor:pointer;
    font-weight:600;
    display:inline-flex;
    align-items:center;
    gap:6px;
}

.btn:disabled{opacity:0.65;cursor:not-allowed;}

.view{ background:var(--ink-900); color:white; }
.edit{ background:linear-gradient(135deg, var(--brand-600), var(--brand-700)); color:white; }
.delete{ background:var(--danger-solid); color:white; }

.header-box{
    background:var(--surface);
    padding:16px 18px;
    border-radius:var(--radius-lg);
    margin-bottom:18px;
    border:1px solid var(--border);
    box-shadow:var(--shadow-sm);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header-box h3{
    margin:0;
    color:var(--ink-900);
}

</style>

<div class="header-box">
    <h3>All Staff Members</h3>
</div>

<div id="staffGrid" class="grid"></div>

<script>

async function loadStaff(){

    let grid = document.getElementById("staffGrid");
    grid.innerHTML = skeletonCards(8);

    let res = await fetch("/admin/api/staff");
    let data = await res.json();

    grid.innerHTML = "";

    if(!data.staff || data.staff.length === 0){
        grid.innerHTML = `<p style="color:var(--ink-500);grid-column:1/-1;text-align:center;padding:30px;">No staff members yet.</p>`;
        return;
    }

    data.staff.forEach(s => {

        grid.innerHTML += `
            <div class="card">
                <img src="${s.photo || 'default.png'}">
                <h3>${s.first_name} ${s.last_name}</h3>
                <p>${s.staff_code}</p>
                <p>${s.contact || ''}</p>
                <p>${s.staff_type}</p>

                <div class="btns">
                    <button class="btn view" onclick="viewStaff(${s.id}, this)">View</button>
                    <button class="btn edit" onclick="editStaff(${s.id}, this)">Edit</button>
                    <button class="btn delete" onclick="deleteStaff(${s.id}, this)">Delete</button>
                </div>
            </div>
        `;
    });
}

function viewStaff(id, btn){
    setButtonLoading(btn, true, "");
    window.location.href = `/admin/api/staff/${id}`;
}

function editStaff(id, btn){
    setButtonLoading(btn, true, "");
    window.location.href = `/admin/staff/edit/${id}`;
}

async function deleteStaff(id, btn){

    if(!confirm("Delete this staff?")) return;

    setButtonLoading(btn, true, "");

    let res = await fetch(`/admin/api/staff/${id}`, { method: "DELETE" });
    let data = await res.json();
    alert(data.message || data.error);

    loadStaff();
}

loadStaff();

</script>

{% endblock %}
