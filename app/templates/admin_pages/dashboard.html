{% extends "admin.html" %}
{% block title %}Dashboard — 1O1 ERP{% endblock %}
{% block page_title %}Dashboard{% endblock %}

{% block content %}
<style>
.kpi-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(190px,1fr));
    gap:16px;
    margin-bottom:28px;
}

.kpi-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:20px;
    box-shadow:var(--shadow-sm);
    display:flex;
    flex-direction:column;
    gap:8px;
    transition:.2s ease;
}
.kpi-card:hover{ box-shadow:var(--shadow-md); transform:translateY(-2px); }

.kpi-icon{
    width:42px; height:42px;
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
    margin-bottom:4px;
}
.kpi-icon.blue   { background:var(--brand-50); }
.kpi-icon.green  { background:var(--success-bg); }
.kpi-icon.amber  { background:var(--warn-bg); }
.kpi-icon.red    { background:var(--danger-bg); }
.kpi-icon.purple { background:#faf5ff; }

.kpi-label{
    font-size:11.5px;
    font-weight:700;
    color:var(--ink-500);
    text-transform:uppercase;
    letter-spacing:.05em;
}

.kpi-value{
    font-size:26px;
    font-weight:800;
    color:var(--ink-900);
    line-height:1;
}

.kpi-sub{
    font-size:11.5px;
    color:var(--ink-400);
}

.charts-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:28px;
}

.chart-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:22px;
    box-shadow:var(--shadow-sm);
}

.chart-card h3{
    font-size:14px;
    font-weight:700;
    color:var(--ink-900);
    margin-bottom:16px;
}

.chart-canvas{ width:100% !important; }

.term-banner{
    background:linear-gradient(135deg, var(--brand-700), var(--ink-900));
    color:white;
    border-radius:var(--radius-lg);
    padding:18px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:24px;
    box-shadow:var(--shadow-brand);
}
.term-banner h2{ font-size:16px; font-weight:700; }
.term-banner span{ font-size:12px; margin-top:2px; display:block; color:#c7d2fe; }
.term-tag{
    background:rgba(212,160,23,.2);
    border:1px solid rgba(212,160,23,.4);
    color:#fcd34d;
    padding:5px 14px;
    border-radius:20px;
    font-size:12px;
    font-weight:700;
}
.no-term-tag{
    background:rgba(239,68,68,.2);
    border:1px solid rgba(239,68,68,.4);
    color:#fca5a5;
    padding:5px 14px;
    border-radius:20px;
    font-size:12px;
    font-weight:700;
}

@media(max-width:900px){ .charts-grid{ grid-template-columns:1fr; } }
@media(max-width:600px){ .kpi-grid{ grid-template-columns:1fr 1fr; } }
</style>

<div class="term-banner">
    <div>
        <h2>School Overview</h2>
        <span id="termLabel">Loading current term...</span>
    </div>
    <span id="termTag" class="term-tag" style="display:none"></span>
</div>

<div class="kpi-grid" id="kpiGrid">
    <div class="kpi-card"><div class="gl-skeleton-line" style="height:80px"></div></div>
    <div class="kpi-card"><div class="gl-skeleton-line" style="height:80px"></div></div>
    <div class="kpi-card"><div class="gl-skeleton-line" style="height:80px"></div></div>
    <div class="kpi-card"><div class="gl-skeleton-line" style="height:80px"></div></div>
    <div class="kpi-card"><div class="gl-skeleton-line" style="height:80px"></div></div>
</div>

<div class="charts-grid">
    <div class="chart-card">
        <h3>📈 Student Enrollment Trend</h3>
        <canvas id="enrollmentChart" class="chart-canvas" height="220"></canvas>
    </div>
    <div class="chart-card">
        <h3>💰 Financial Overview (Current Term)</h3>
        <canvas id="financeChart" class="chart-canvas" height="220"></canvas>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
function fmt(n){
    return "UGX " + Number(n || 0).toLocaleString();
}

async function loadDashboard(){
    try{
        const res  = await fetch("/admin/api/dashboard");
        const data = await res.json();

        const label = document.getElementById("termLabel");
        const tag   = document.getElementById("termTag");

        if(data.active_term){
            label.textContent    = "Current active term";
            tag.textContent      = data.active_term;
            tag.style.display    = "inline";
        } else {
            label.textContent    = "No term is currently active";
            tag.className        = "no-term-tag";
            tag.textContent      = "Inactive";
            tag.style.display    = "inline";
        }

        const kpis = [
            { icon:"🎓", cls:"blue",   label:"Total Students",    value: data.kpis.total_students,                      sub:"registered" },
            { icon:"👨‍🏫", cls:"green",  label:"Teaching Staff",    value: data.kpis.teaching_staff,                      sub:"active" },
            { icon:"💵", cls:"amber",  label:"Fees Collected",    value: fmt(data.kpis.fees_collected),                  sub:"current term" },
            { icon:"📉", cls:"purple", label:"Total Expenses",    value: fmt(data.kpis.total_expenses),                  sub:"current term" },
            { icon:"⚠️", cls:"red",    label:"Outstanding Fees",  value: fmt(data.kpis.fees_outstanding),                sub:"unpaid" },
        ];

        document.getElementById("kpiGrid").innerHTML = kpis.map(k => `
            <div class="kpi-card">
                <div class="kpi-icon ${k.cls}">${k.icon}</div>
                <div class="kpi-label">${k.label}</div>
                <div class="kpi-value">${k.value}</div>
                <div class="kpi-sub">${k.sub}</div>
            </div>
        `).join("");

        const enroll = data.enrollment_trend || [];
        new Chart(document.getElementById("enrollmentChart"), {
            type: "line",
            data: {
                labels:   enroll.map(e => e.label),
                datasets: [{
                    label:           "New Students",
                    data:            enroll.map(e => e.count),
                    borderColor:     "#4f46e5",
                    backgroundColor: "rgba(79,70,229,0.08)",
                    borderWidth:     2.5,
                    pointRadius:     4,
                    tension:         0.4,
                    fill:            true,
                }]
            },
            options:{
                responsive:true,
                plugins:{ legend:{ display:false } },
                scales:{
                    y:{ beginAtZero:true, ticks:{ precision:0 } },
                    x:{ grid:{ display:false } }
                }
            }
        });

        const fin = data.financial_summary;
        new Chart(document.getElementById("financeChart"), {
            type: "bar",
            data: {
                labels:   ["Fees Collected", "Expenses", "Outstanding"],
                datasets: [{
                    label:           "UGX",
                    data:            [fin.collected, fin.expenses, fin.outstanding],
                    backgroundColor: ["#10b981","#ef4444","#f59e0b"],
                    borderRadius:    8,
                    borderSkipped:   false,
                }]
            },
            options:{
                responsive:true,
                plugins:{
                    legend:{ display:false },
                    tooltip:{
                        callbacks:{
                            label: ctx => " UGX " + Number(ctx.raw).toLocaleString()
                        }
                    }
                },
                scales:{
                    y:{ beginAtZero:true, ticks:{ callback: v => "UGX " + Number(v).toLocaleString() } },
                    x:{ grid:{ display:false } }
                }
            }
        });

    } catch(err){
        console.error("Dashboard load failed:", err);
    }
}

loadDashboard();
</script>
{% endblock %}
