{% extends "admin.html" %}

{% block title %}System Settings{% endblock %}
{% block page_title %}System Settings{% endblock %}

{% block content %}

<style>

.settings-wrapper{
    max-width:600px;
}

.settings-card{
    background:var(--surface);
    border-radius:var(--radius-xl);
    border:1px solid var(--border);
    box-shadow:var(--shadow-sm);
    overflow:hidden;
}

.settings-card-header{
    padding:20px 24px;
    border-bottom:1px solid var(--border-soft);
}

.settings-card-header h2{
    margin:0;
    font-size:16.5px;
    font-weight:800;
    color:var(--ink-900);
}

.settings-card-header p{
    margin-top:4px;
    font-size:13px;
    color:var(--ink-500);
    font-weight:500;
}

.settings-card-body{
    padding:24px;
    display:grid;
    gap:14px;
}

.settings-card-body label{
    font-size:11.5px;
    font-weight:700;
    color:var(--ink-500);
    text-transform:uppercase;
    letter-spacing:0.04em;
}

.settings-card-body input{
    width:100%;
    padding:11px 13px;
    border:1.5px solid var(--border);
    border-radius:var(--radius-sm);
    outline:none;
    font-size:14px;
    font-family:inherit;
    transition:border-color 0.15s ease, box-shadow 0.15s ease;
}

.settings-card-body input:focus{
    border-color:var(--brand-500);
    box-shadow:0 0 0 4px var(--brand-50);
}

.settings-btn{
    background:linear-gradient(135deg, var(--brand-600), var(--brand-700));
    color:white;
    border:none;
    padding:12px;
    border-radius:var(--radius-sm);
    cursor:pointer;
    font-weight:700;
    font-size:14px;
    font-family:inherit;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    box-shadow:var(--shadow-brand);
    transition:filter 0.15s ease;
}

.settings-btn:hover:not(:disabled){
    filter:brightness(1.06);
}

.settings-btn:disabled{
    opacity:0.7;
    cursor:not-allowed;
}

.msg{
    font-size:13px;
    margin-top:4px;
    font-weight:600;
}

.msg.success{ color:var(--success-text); }
.msg.error{ color:var(--danger-text); }

.settings-toast{
    position:fixed;
    bottom:24px;
    right:24px;
    padding:13px 20px;
    background:var(--success-dot);
    color:white;
    border-radius:var(--radius-md);
    font-weight:700;
    font-size:13.5px;
    opacity:0;
    transform:translateY(16px);
    transition:0.3s ease;
    z-index:var(--z-modal);
    box-shadow:var(--shadow-lg);
    pointer-events:none;
}

.settings-toast.show{
    opacity:1;
    transform:translateY(0);
}

</style>

<div class="settings-wrapper">

  <div class="settings-card">

    <div class="settings-card-header">
      <h2>System Admin Password</h2>
      <p>Update the password used to sign in to this admin account</p>
    </div>

    <div class="settings-card-body">

      <div>
        <label>Current Password</label>
        <input type="password" id="current">
      </div>

      <div>
        <label>New Password</label>
        <input type="password" id="new">
      </div>

      <div>
        <label>Confirm Password</label>
        <input type="password" id="confirm">
      </div>

      <button class="settings-btn" id="updatePwBtn" onclick="updatePassword(this)">Update Password</button>

      <div id="msg" class="msg"></div>

    </div>

  </div>

</div>

<div class="settings-toast" id="toast"></div>

<script>

function showToast(text) {
  const t = document.getElementById("toast");
  t.textContent = text;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3000);
}

function showMsg(text, type) {
  const el = document.getElementById("msg");
  el.textContent = text;
  el.className = "msg " + type;
}

async function updatePassword(btn) {

  const current = document.getElementById("current").value;
  const newPw = document.getElementById("new").value;
  const confirm = document.getElementById("confirm").value;

  if (!current || !newPw || !confirm) {
    showMsg("All fields are required", "error");
    return;
  }

  if (newPw !== confirm) {
    showMsg("Passwords do not match", "error");
    return;
  }

  setButtonLoading(btn, true, "Updating...");

  try {
    const res = await fetch("/api/students/settings/change-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        current_password: current,
        new_password: newPw
      })
    });

    const data = await res.json();

    if (res.ok) {
      showMsg("Password updated successfully", "success");
      showToast("Password changed");
      document.getElementById("current").value = "";
      document.getElementById("new").value = "";
      document.getElementById("confirm").value = "";
    } else {
      showMsg(data.message || "Failed to update password", "error");
    }
  } finally {
    setButtonLoading(btn, false);
  }
}

</script>

{% endblock %}
