<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}1O1 School ERP{% endblock %}</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --brand-700:#4338ca;
    --brand-600:#4f46e5;
    --brand-500:#6366f1;
    --brand-50:#eef2ff;

    --ink-900:#0b1120;
    --ink-800:#1e293b;
    --ink-700:#334155;
    --ink-500:#64748b;
    --ink-400:#94a3b8;
    --ink-300:#cbd5e1;

    --gold:#d4a017;

    --border:#e2e8f0;
    --border-soft:#eef1f6;
    --surface:#ffffff;
    --surface-soft:#f8fafc;
    --bg:#f5f7fb;

    --success-bg:#ecfdf5;--success-text:#047857;--success-dot:#10b981;
    --warn-bg:#fffbeb;--warn-text:#92400e;--warn-dot:#f59e0b;
    --danger-bg:#fef2f2;--danger-text:#b91c1c;--danger-solid:#dc2626;--danger-dot:#ef4444;

    --radius-xl:20px;
    --radius-lg:14px;
    --radius-md:10px;
    --radius-sm:8px;

    --shadow-sm:0 1px 2px rgba(15,23,42,0.05);
    --shadow-md:0 6px 16px rgba(15,23,42,0.08);
    --shadow-lg:0 16px 40px rgba(15,23,42,0.16);
    --shadow-brand:0 10px 24px rgba(79,70,229,0.28);

    --z-content:1;
    --z-topbar:900;
    --z-sidebar:1000;
    --z-modal:2000;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg);
    color:var(--ink-800);
}

/* ================= GLOBAL SPINNER / SKELETON (shared everywhere) ================= */

.gl-spinner{
    width:14px;
    height:14px;
    border-radius:50%;
    border:2px solid currentColor;
    border-top-color:transparent;
    opacity:0.9;
    animation:gl-spin 0.6s linear infinite;
    flex-shrink:0;
    display:inline-block;
}

@keyframes gl-spin{ to{ transform:rotate(360deg); } }

button.gl-loading{
    pointer-events:none;
    opacity:0.85;
}

.gl-skeleton-line{
    height:14px;
    border-radius:6px;
    background:linear-gradient(90deg, #eef1f6 25%, #e2e8f0 37%, #eef1f6 63%);
    background-size:400% 100%;
    animation:gl-shimmer 1.4s ease infinite;
}

.gl-skeleton-tiny{width:50%;height:20px;border-radius:12px;}

@keyframes gl-shimmer{
    0%{background-position:100% 50%;}
    100%{background-position:0 50%;}
}

.gl-skeleton-table{width:100%;border-collapse:collapse;}
.gl-skeleton-table th{
    background:var(--surface-soft);
    padding:13px 16px;
    text-align:left;
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--ink-500);
    border-bottom:1px solid var(--border);
}
.gl-skeleton-table td{
    padding:13px 16px;
    border-bottom:1px solid var(--border-soft);
}

.gl-skeleton-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
    gap:16px;
}

.gl-skeleton-card{
    background:var(--surface);
    border-radius:16px;
    padding:20px;
    border:1px solid var(--border);
    text-align:center;
}

.gl-skeleton-avatar{
    width:80px;
    height:80px;
    border-radius:50%;
    margin:0 auto 14px;
    background:linear-gradient(90deg, #eef1f6 25%, #e2e8f0 37%, #eef1f6 63%);
    background-size:400% 100%;
    animation:gl-shimmer 1.4s ease infinite;
}

/* ================= SIDEBAR ================= */

.sidebar{
    position:fixed;
    top:0;
    left:0;
    bottom:0;
    width:260px;
    background:linear-gradient(180deg, var(--ink-900), #131c31);
    color:white;
    padding:20px;
    transition:0.3s ease;
    overflow-y:auto;
    z-index:var(--z-sidebar);
}

.sidebar.collapsed{
    transform:translateX(-100%);
}

.logo{
    font-size:22px;
    font-weight:800;
    color:white;
    letter-spacing:-0.02em;
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
}

.logo::before{
    content:"";
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--brand-500);
    box-shadow:0 0 0 4px rgba(99,102,241,0.25);
}

/* CLOSE BUTTON — mobile only; desktop uses the ☰ toggle in the topbar */
.close-btn{
    display:none;
    justify-content:flex-end;
    margin-bottom:10px;
}

.close-btn button{
    background:none;
    border:none;
    color:white;
    font-size:20px;
    cursor:pointer;
    line-height:1;
    padding:4px;
}

@media(max-width:768px){
    .close-btn{
        display:flex;
    }
}

/* SECTION LABELS */
.nav-title{
    font-size:11px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-400);
    margin:22px 4px 8px;
}

.nav-title:first-of-type{
    margin-top:16px;
}

.nav-item{
    margin-bottom:4px;
}

.nav-item a{
    display:block;
    padding:12px;
    border-radius:10px;
    text-decoration:none;
    color:#cbd5e1;
    transition:0.15s ease;
    font-weight:500;
    font-size:14px;
}

.nav-item a:hover{
    background:rgba(99,102,241,0.15);
    color:white;
}

.nav-item a.active{
    background:linear-gradient(135deg, var(--brand-600), var(--brand-700));
    color:white;
    font-weight:600;
    box-shadow:0 4px 12px rgba(79,70,229,0.35);
}

.logout{
    margin-top:8px;
    padding-top:12px;
    border-top:1px solid rgba(255,255,255,0.08);
}

.logout a{
    color:#fca5a5;
}

.logout a:hover{
    background:rgba(239,68,68,0.12);
    color:#fca5a5;
}

/* DROPDOWN */
.dropdown{
    margin-bottom:4px;
}

.dropdown-header{
    padding:12px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
    font-size:14px;
    color:#cbd5e1;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.06);
    transition:0.15s;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.dropdown-header:hover{
    background:rgba(99,102,241,0.15);
    color:white;
}

.dropdown-header .chevron{
    display:inline-block;
    transition:transform 0.2s ease;
    font-size:11px;
}

.dropdown.open .dropdown-header .chevron{
    transform:rotate(180deg);
}

.dropdown-menu{
    display:none;
    flex-direction:column;
    padding-top:6px;
}

.dropdown.open .dropdown-menu{
    display:flex;
}

.dropdown-menu a{
    display:block;
    padding:10px 12px 10px 20px;
    margin:2px 0;
    border-radius:8px;
    text-decoration:none;
    color:#cbd5e1;
    font-size:13.5px;
    background:rgba(255,255,255,0.03);
    transition:0.15s;
}

.dropdown-menu a:hover{
    background:rgba(99,102,241,0.18);
    color:white;
}

/* ================= MAIN ================= */

.main{
    margin-left:260px;
    transition:0.3s ease;
}

.main.full{
    margin-left:0;
}

/* TOP BAR */
.topbar{
    position:sticky;
    top:0;
    z-index:var(--z-topbar);
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px 24px;
    background:rgba(255,255,255,0.9);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
}

.topbar h3{
    font-size:15px;
    font-weight:700;
    color:var(--ink-900);
}

.menu-btn{
    background:linear-gradient(135deg, var(--brand-600), var(--brand-700));
    color:white;
    border:none;
    padding:10px 16px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
    font-size:13.5px;
    box-shadow:var(--shadow-brand);
}

/* CONTENT */
.content{
    padding:24px;
    position:relative;
    z-index:var(--z-content);
}

/* RESPONSIVE */
@media(max-width:768px){
    .main{
        margin-left:0;
    }

    .sidebar{
        transform:translateX(-100%);
    }

    .sidebar.open{
        transform:translateX(0);
    }
}

</style>

</head>

<body>

<!-- GLOBAL UI HELPERS — available to every page, defined before any child script runs -->
<script>
function setButtonLoading(btn, loading, loadingText){
    if(!btn) return;
    if(loading){
        btn.dataset.glOriginalHtml = btn.innerHTML;
        btn.disabled = true;
        btn.classList.add("gl-loading");
        btn.innerHTML = `<span class="gl-spinner"></span><span>${loadingText || "Loading..."}</span>`;
    }else{
        btn.disabled = false;
        btn.classList.remove("gl-loading");
        if(btn.dataset.glOriginalHtml !== undefined){
            btn.innerHTML = btn.dataset.glOriginalHtml;
            delete btn.dataset.glOriginalHtml;
        }
    }
}

function skeletonRows(headers, rowCount){
    rowCount = rowCount || 6;
    let headHtml = headers.map(h => `<th>${h}</th>`).join("");
    let rowHtml = Array.from({length: rowCount}).map(()=>{
        let cells = headers.map((_, i) =>
            `<td><div class="gl-skeleton-line ${i === headers.length - 1 ? 'gl-skeleton-tiny' : ''}"></div></td>`
        ).join("");
        return `<tr>${cells}</tr>`;
    }).join("");

    return `<table class="gl-skeleton-table"><thead><tr>${headHtml}</tr></thead><tbody>${rowHtml}</tbody></table>`;
}

function skeletonCards(count){
    count = count || 6;
    return `<div class="gl-skeleton-grid">` +
        Array.from({length: count}).map(()=>`
            <div class="gl-skeleton-card">
                <div class="gl-skeleton-avatar"></div>
                <div class="gl-skeleton-line" style="width:70%;margin:0 auto 8px;"></div>
                <div class="gl-skeleton-line gl-skeleton-tiny" style="width:50%;margin:0 auto;"></div>
            </div>
        `).join("") +
    `</div>`;
}
</script>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">

    <!-- CLOSE (mobile only) -->
    <div class="close-btn">
        <button onclick="toggleSidebar()">✕</button>
    </div>

    <div class="logo"> 1O1 School ERP</div>

    <div class="nav-title">MAIN</div>

    <div class="nav-item">
        <a href="{{ url_for('admin.dashboard_page') }}">Dashboard</a>
    </div>

    <div class="nav-title">ACADEMIC</div>

    <div class="nav-item">
        <a href="{{ url_for('admin.terms_page') }}">Terms</a>
    </div>

    <div class="nav-item">
        <a href="{{ url_for('admin.fee_structures_page') }}">fees structure</a>
    </div>

    <!-- USERS & ROLES -->
    <div class="nav-title">MANAGEMENT</div>

    <div class="dropdown" id="dropdown">

        <div class="dropdown-header" onclick="toggleDropdown()">
            <span>Users & Roles</span>
            <span class="chevron">▾</span>
        </div>

        <div class="dropdown-menu">
            <a href="{{ url_for('admin.add_staff_page') }}">add staff</a>
            <a href="{{ url_for('admin.staff_profiles_page') }}">staff profiles</a>
            <a href="{{ url_for('admin.roles_permissions_page') }}">roles & permissions</a>
        </div>

    </div>

    <div class="nav-title">SYSTEM</div>

    <div class="nav-item">
        <a href="{{ url_for('admin.system_settings_page') }}">system settings</a>
    </div>

    <div class="nav-item">
      <a href="{{ url_for('admin.data_control_page') }}">Data Control</a>
    </div>

    <div class="nav-title">ACCOUNT</div>

    <div class="nav-item logout">
        <a href="{{ url_for('auth.logout') }}">Logout</a>
    </div>

</aside>

<!-- MAIN -->
<div class="main" id="main">

    <div class="topbar">
        <button class="menu-btn" onclick="toggleSidebar()">☰ Menu</button>
        <h3>{% block page_title %}Dashboard{% endblock %}</h3>
    </div>

    <div class="content">
        {% block content %}
        {% endblock %}
    </div>

</div>

<script>

function toggleSidebar(){

    const sidebar = document.getElementById("sidebar");
    const main = document.getElementById("main");

    if(window.innerWidth <= 768){
        sidebar.classList.toggle("open");
    }else{
        sidebar.classList.toggle("collapsed");
        main.classList.toggle("full");
    }
}

/* DROPDOWN */
function toggleDropdown(){
    document.getElementById("dropdown").classList.toggle("open");
}

</script>

</body>
</html>
