<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>1O1 School Management System — Login</title>

  <style>
    /* ── Reset & base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-padding-top: env(safe-area-inset-top, 0px); }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      padding-top: calc(24px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(135deg, #0d1b2a 0%, #1a3a5c 60%, #1e5fa8 100%);
      background-size: 200% 200%;
      animation: gradientShift 14s ease infinite;
      overflow-x: hidden;
    }

    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes shake {
      10%, 90% { transform: translateX(-1px); }
      20%, 80% { transform: translateX(2px); }
      30%, 50%, 70% { transform: translateX(-4px); }
      40%, 60% { transform: translateX(4px); }
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Brand header ─────────────────────────────────────────── */
    .brand {
      text-align: center;
      margin-bottom: 28px;
      color: #fff;
      animation: fadeSlideUp .6s ease both;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, #2d6cdf, #1e9af3);
      margin-bottom: 12px;
      box-shadow: 0 4px 18px rgba(29,106,223,.45);
      transition: transform .3s ease, box-shadow .3s ease;
    }

    .brand-logo:hover {
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 8px 26px rgba(29,106,223,.55);
    }

    .brand-logo svg {
      width: 36px;
      height: 36px;
      fill: #fff;
    }

    .brand-name {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: .5px;
      color: #fff;
    }

    .brand-name span {
      color: #4fa3f7;
    }

    .brand-tagline {
      font-size: .82rem;
      color: #a0b8d8;
      margin-top: 4px;
      letter-spacing: .3px;
    }

    /* ── Card ─────────────────────────────────────────────────── */
    .card {
      width: 420px;
      max-width: 100%;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
      overflow: hidden;
      animation: fadeSlideUp .6s .1s ease both;
      transition: box-shadow .3s ease;
    }

    /* ── Tabs ─────────────────────────────────────────────────── */
    .tabs {
      display: flex;
      position: relative;
    }

    .tab {
      flex: 1;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      font-weight: 600;
      font-size: .93rem;
      background: #eef2f9;
      color: #5a6a85;
      border-bottom: 3px solid transparent;
      transition: background .2s ease, color .2s ease, border-color .2s ease;
      user-select: none;
    }

    .tab:hover { background: #dde7f5; color: #2d6cdf; }

    .tab.active {
      background: #fff;
      color: #2d6cdf;
      border-bottom-color: #2d6cdf;
    }

    /* ── Form panels ──────────────────────────────────────────── */
    .panel {
      display: none;
      padding: 32px 36px 28px;
    }

    .panel.active {
      display: block;
      animation: fadeIn .35s ease both;
    }

    .panel h3 {
      font-size: 1.15rem;
      color: #1a2740;
      margin-bottom: 22px;
      font-weight: 700;
    }

    /* ── Inputs ───────────────────────────────────────────────── */
    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: .8rem;
      font-weight: 600;
      color: #5a6a85;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .4px;
    }

    .field input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #d0d9ea;
      border-radius: 9px;
      font-size: .95rem;
      color: #1a2740;
      background: #f7f9fc;
      transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
      outline: none;
    }

    .field input:focus {
      border-color: #2d6cdf;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(45,108,223,.12);
    }

    /* ── Password field with show/hide toggle ────────────────── */
    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 42px;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 6px;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
      color: #7d8ba6;
      transition: color .15s ease, background .15s ease;
      padding: 0;
    }

    .toggle-password:hover {
      color: #2d6cdf;
      background: rgba(45,108,223,.08);
    }

    .toggle-password svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .toggle-password .icon-eye-off { display: none; }
    .toggle-password.is-visible .icon-eye     { display: none; }
    .toggle-password.is-visible .icon-eye-off { display: flex; }

    /* ── Button ───────────────────────────────────────────────── */
    .btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(90deg, #2d6cdf, #1e9af3);
      background-size: 160% 160%;
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity .2s ease, transform .1s ease, box-shadow .2s ease, background-position .3s ease;
      letter-spacing: .3px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover:not(:disabled) {
      opacity: .95;
      background-position: 100% 0;
      box-shadow: 0 6px 18px rgba(29,106,223,.35);
    }

    .btn:active:not(:disabled) { transform: scale(.98); }

    .btn:disabled {
      opacity: .7;
      cursor: not-allowed;
    }

    /* ── Messages ─────────────────────────────────────────────── */
    .msg {
      min-height: 0;
      font-size: .86rem;
      margin-bottom: 0;
      border-radius: 7px;
      padding: 0;
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transform: translateY(-4px);
      transition: all .25s ease;
    }

    .msg.error,
    .msg.success {
      max-height: 60px;
      opacity: 1;
      transform: translateY(0);
      margin-bottom: 10px;
      padding: 9px 12px;
    }

    .msg.error {
      color: #c0392b;
      background: #fdf0ee;
      border-left: 3px solid #e74c3c;
      animation: shake .35s ease;
    }

    .msg.success {
      color: #1e7e34;
      background: #edfbf1;
      border-left: 3px solid #28a745;
    }

    /* ── Footer ───────────────────────────────────────────────── */
    .footer {
      margin-top: 22px;
      text-align: center;
      font-size: .78rem;
      color: #7090b8;
      animation: fadeIn .8s .2s ease both;
    }

    .footer a {
      color: #4fa3f7;
      text-decoration: none;
      transition: color .15s ease;
    }

    .footer a:hover {
      color: #fff;
      text-decoration: underline;
    }

    /* ── Spinner inside button ────────────────────────────────── */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      flex-shrink: 0;
    }

    /* ── Responsive ───────────────────────────────────────────── */
    @media (max-width: 480px) {
      body { padding: 16px 12px; }

      .brand-logo { width: 56px; height: 56px; border-radius: 14px; }
      .brand-logo svg { width: 30px; height: 30px; }
      .brand-name { font-size: 1.3rem; }
      .brand-tagline { font-size: .76rem; }

      .card { border-radius: 14px; }

      .panel { padding: 24px 20px 22px; }
      .panel h3 { font-size: 1.05rem; margin-bottom: 18px; }

      .tab { padding: 13px; font-size: .87rem; }

      .field input { padding: 10px 12px; font-size: .92rem; }
      .password-wrap input { padding-right: 40px; }

      .btn { padding: 12px; font-size: .95rem; }
    }

    @media (max-width: 340px) {
      .brand-name { font-size: 1.15rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- ── Brand ─────────────────────────────────────────────── -->
  <div class="brand">
    <div class="brand-logo">
      <!-- simple graduation-cap icon -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/>
      </svg>
    </div>
    <div class="brand-name"><span>1O1</span> School Management System</div>
    <div class="brand-tagline">Powered by 1O1 Technologies</div>
  </div>

  <!-- ── Login card ─────────────────────────────────────────── -->
  <div class="card">

    <div class="tabs">
      <div class="tab active" id="tab-staff"   onclick="switchTab('staff')">Staff</div>
      <div class="tab"        id="tab-student" onclick="switchTab('student')">Student</div>
    </div>

    <!-- STAFF PANEL -->
    <div class="panel active" id="panel-staff">
      <h3>Staff Login</h3>

      <div class="msg" id="staff_msg"></div>

      <div class="field">
        <label>School ID</label>
        <input id="staff_school" type="text" placeholder="Enter your school ID" autocomplete="off" />
      </div>
      <div class="field">
        <label>Username</label>
        <input id="staff_username" type="text" placeholder="Enter your username" autocomplete="username" />
      </div>
      <div class="field">
        <label>Password</label>
        <div class="password-wrap">
          <input id="staff_password" type="password" placeholder="Enter your password" autocomplete="current-password" />
          <button type="button" class="toggle-password" id="staff_toggle" onclick="togglePassword('staff_password','staff_toggle')" aria-label="Show password">
            <svg class="icon-eye" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.6 20.6 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 5c7 0 11 7 11 7a20.7 20.7 0 0 1-2.29 3.36M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>

      <button class="btn" id="staff_btn" onclick="loginStaff()">Login</button>
    </div>

    <!-- STUDENT PANEL -->
    <div class="panel" id="panel-student">
      <h3>Student Login</h3>

      <div class="msg" id="student_msg"></div>

      <div class="field">
        <label>School ID</label>
        <input id="student_school" type="text" placeholder="Enter your school ID" autocomplete="off" />
      </div>
      <div class="field">
        <label>Student Code</label>
        <input id="student_code" type="text" placeholder="Enter your student code" autocomplete="username" />
      </div>
      <div class="field">
        <label>Password</label>
        <div class="password-wrap">
          <input id="student_password" type="password" placeholder="Enter your password" autocomplete="current-password" />
          <button type="button" class="toggle-password" id="student_toggle" onclick="togglePassword('student_password','student_toggle')" aria-label="Show password">
            <svg class="icon-eye" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.6 20.6 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 5c7 0 11 7 11 7a20.7 20.7 0 0 1-2.29 3.36M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>

      <button class="btn" id="student_btn" onclick="loginStudent()">Login</button>
    </div>

  </div>

  <!-- ── Footer ─────────────────────────────────────────────── -->
  <div class="footer">
    &copy; 2026 <a href="#">1O1 Technologies</a>. All rights reserved.
  </div>

<script>
  /* ── Tab switching ──────────────────────────────────────── */
  function switchTab(tab) {
    ['staff', 'student'].forEach(t => {
      document.getElementById('tab-'   + t).classList.toggle('active', t === tab);
      document.getElementById('panel-' + t).classList.toggle('active', t === tab);
    });
  }

  /* ── Password show/hide toggle ──────────────────────────── */
  function togglePassword(inputId, btnId) {
    const input = document.getElementById(inputId);
    const btn   = document.getElementById(btnId);
    const nowVisible = input.type === 'password';

    input.type = nowVisible ? 'text' : 'password';
    btn.classList.toggle('is-visible', nowVisible);
    btn.setAttribute('aria-label', nowVisible ? 'Hide password' : 'Show password');
  }

  /* ── Message helper ─────────────────────────────────────── */
  function showMessage(id, msg, type) {
    const el = document.getElementById(id);
    el.textContent  = msg;
    el.className    = 'msg ' + type;
  }

  function clearMessage(id) {
    const el = document.getElementById(id);
    el.textContent = '';
    el.className   = 'msg';
  }

  /* ── Button loading state ───────────────────────────────── */
  function setLoading(btnId, loading) {
    const btn = document.getElementById(btnId);
    if (loading) {
      btn.dataset.originalText = btn.textContent;
      btn.disabled  = true;
      btn.innerHTML = '<span class="spinner"></span><span>Signing in…</span>';
    } else {
      btn.disabled   = false;
      btn.textContent = btn.dataset.originalText || 'Login';
    }
  }

  /* ── Staff login ────────────────────────────────────────── */
  async function loginStaff() {
    clearMessage('staff_msg');

    const school   = document.getElementById('staff_school').value.trim();
    const username = document.getElementById('staff_username').value.trim();
    const password = document.getElementById('staff_password').value;

    if (!school || !username || !password) {
      showMessage('staff_msg', 'All fields are required.', 'error');
      return;
    }

    setLoading('staff_btn', true);

    try {
      const res = await fetch('/auth/staff/login', {
        method:      'POST',
        headers:     { 'Content-Type': 'application/json' },
        credentials: 'include',
        body:        JSON.stringify({ school_id: school, username, password }),
      });

      const data = await res.json();

      if (!res.ok) {
        showMessage('staff_msg', data.message || 'Login failed.', 'error');
        return;
      }

      showMessage('staff_msg', 'Login successful — redirecting…', 'success');
      setTimeout(() => { window.location.href = data.redirect; }, 600);
      return; // keep the button in its loading state through the redirect

    } catch (err) {
      showMessage('staff_msg', 'Network error. Please try again.', 'error');
    } finally {
      if (!document.getElementById('staff_msg').classList.contains('success')) {
        setLoading('staff_btn', false);
      }
    }
  }

  /* ── Student login ──────────────────────────────────────── */
  async function loginStudent() {
    clearMessage('student_msg');

    const school      = document.getElementById('student_school').value.trim();
    const studentCode = document.getElementById('student_code').value.trim();
    const password    = document.getElementById('student_password').value;

    if (!school || !studentCode || !password) {
      showMessage('student_msg', 'All fields are required.', 'error');
      return;
    }

    setLoading('student_btn', true);

    try {
      const res = await fetch('/auth/student/login', {
        method:      'POST',
        headers:     { 'Content-Type': 'application/json' },
        credentials: 'include',
        body:        JSON.stringify({
          school_id:    school,
          student_code: studentCode,   // ← matches the backend field name
          password,
        }),
      });

      const data = await res.json();

      if (!res.ok) {
        showMessage('student_msg', data.message || 'Login failed.', 'error');
        return;
      }

      showMessage('student_msg', 'Login successful — redirecting…', 'success');
      setTimeout(() => { window.location.href = data.redirect || '/protected'; }, 600);
      return; // keep the button in its loading state through the redirect

    } catch (err) {
      showMessage('student_msg', 'Network error. Please try again.', 'error');
    } finally {
      if (!document.getElementById('student_msg').classList.contains('success')) {
        setLoading('student_btn', false);
      }
    }
  }

  /* ── Enter-key support ──────────────────────────────────── */
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (document.getElementById('panel-staff').classList.contains('active')) {
      loginStaff();
    } else {
      loginStudent();
    }
  });
</script>

</body>
</html>
