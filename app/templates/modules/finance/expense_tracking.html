{% extends "base.html" %}
{% block title %}Expense Tracking{% endblock %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,wght@0,700;0,900;1,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ── BASE ── */
.exp-wrap{ font-family:'DM Sans',sans-serif; color:#0f172a; }

/* ── TERM BANNER ── */
.term-banner{
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:10px;
    background:#0f172a; color:#fff;
    border-radius:16px; padding:16px 22px;
    margin-bottom:24px;
}
.term-banner h2{ font-family:'Fraunces',serif; font-size:18px; font-weight:900; }
.term-banner span{ font-size:12px; opacity:.6; font-family:'DM Mono',monospace; }
.term-pill{
    padding:5px 14px; border-radius:20px; font-size:12px; font-weight:700;
    font-family:'DM Mono',monospace;
}
.term-pill.active { background:rgba(212,160,23,.2); border:1px solid rgba(212,160,23,.4); color:#fcd34d; }
.term-pill.locked { background:rgba(239,68,68,.15); border:1px solid rgba(239,68,68,.3); color:#fca5a5; }
.term-pill.none   { background:rgba(148,163,184,.15); border:1px solid rgba(148,163,184,.3); color:#94a3b8; }

/* ── GRID ── */
.exp-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:24px;
}
@media(max-width:900px){ .exp-grid{ grid-template-columns:1fr; } }

/* ── CARD ── */
.exp-card{
    background:#fff;
    border:1px solid #e2e8f0;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 2px 12px rgba(15,23,42,0.05);
}
.exp-card-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 22px 14px;
    border-bottom:1px solid #f1f5f9;
}
.exp-card-head h3{
    font-family:'Fraunces',serif;
    font-size:16px; font-weight:700; color:#0f172a;
}
.exp-card-body{ padding:20px 22px; }

/* ── FORM ── */
.exp-form{ display:grid; gap:13px; }
.exp-form label{ font-size:11.5px; font-weight:700; color:#64748b; display:block; margin-bottom:4px; font-family:'DM Mono',monospace; text-transform:uppercase; letter-spacing:.05em; }
.exp-input{
    width:100%; height:42px;
    border:1px solid #e2e8f0; border-radius:10px;
    padding:0 13px; font-size:13.5px; outline:none;
    font-family:'DM Sans',sans-serif;
    transition:.15s;
}
.exp-input:focus{ border-color:#0f172a; }
.exp-input:disabled{ background:#f8fafc; color:#94a3b8; cursor:not-allowed; }
textarea.exp-input{ height:80px; padding:10px 13px; resize:vertical; }

.exp-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

.exp-btn{
    height:42px; padding:0 20px;
    border:none; border-radius:10px;
    font-size:13.5px; font-weight:700;
    cursor:pointer; transition:.2s;
    font-family:'DM Sans',sans-serif;
}
.exp-btn.primary{ background:#0f172a; color:#fff; }
.exp-btn.primary:hover:not(:disabled){ background:#1e293b; }
.exp-btn.primary:disabled{ opacity:.4; cursor:not-allowed; }
.exp-btn.ghost{ background:#f1f5f9; color:#0f172a; border:1px solid #e2e8f0; }
.exp-btn.ghost:hover{ background:#e2e8f0; }
.exp-btn.danger{ background:#fef2f2; color:#dc2626; border:1px solid #fecaca; }
.exp-btn.danger:hover{ background:#fee2e2; }

/* ── HISTORY FILTERS ── */
.hist-bar{
    display:flex; gap:10px; flex-wrap:wrap; align-items:center;
    margin-bottom:16px;
}
.hist-bar .exp-input{ height:38px; width:auto; flex:1; min-width:120px; }

/* ── TABLE ── */
.exp-table-wrap{ overflow-x:auto; }
table{ width:100%; border-collapse:collapse; }
thead th{
    background:#f8fafc; padding:11px 14px;
    text-align:left; font-size:11px; font-weight:700;
    color:#64748b; text-transform:uppercase;
    letter-spacing:.05em; white-space:nowrap;
    font-family:'DM Mono',monospace;
}
tbody td{ padding:11px 14px; border-top:1px solid #f1f5f9; font-size:13px; }
tbody tr:hover td{ background:#fafafa; }

.cat-badge{
    display:inline-block; padding:3px 9px;
    border-radius:20px; font-size:11px; font-weight:700;
    font-family:'DM Mono',monospace;
}
.cat-Salaries     { background:#dbeafe; color:#1d4ed8; }
.cat-Utilities    { background:#fef9c3; color:#854d0e; }
.cat-Supplies     { background:#dcfce7; color:#15803d; }
.cat-Maintenance  { background:#ede9fe; color:#6d28d9; }
.cat-Transport    { background:#ffedd5; color:#c2410c; }
.cat-Other        { background:#f1f5f9; color:#475569; }

.status-badge{
    display:inline-block; padding:3px 9px;
    border-radius:20px; font-size:11px; font-weight:700;
}
.status-Approved { background:#dcfce7; color:#15803d; }
.status-Pending  { background:#fef9c3; color:#854d0e; }
.status-Rejected { background:#fef2f2; color:#dc2626; }

.no-data{ text-align:center; padding:40px; color:#94a3b8; font-size:13px; }

/* ── SKELETON ── */
.skeleton{
    background:linear-gradient(90deg,#f0f4f8 25%,#e2e8f0 50%,#f0f4f8 75%);
    background-size:200% 100%;
    animation:shimmer 1.4s infinite;
    border-radius:6px; height:14px; margin:6px 0;
}
@keyframes shimmer{ to{ background-position:-200% 0; } }

/* ── KPI STRIP ── */
.kpi-strip{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:12px; margin-bottom:24px;
}
.kpi-tile{
    background:#fff; border:1px solid #e2e8f0;
    border-radius:14px; padding:16px 18px;
    box-shadow:0 2px 8px rgba(15,23,42,0.04);
}
.kpi-tile .label{ font-size:11px; color:#64748b; font-family:'DM Mono',monospace; text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px; }
.kpi-tile .val{ font-size:20px; font-weight:800; font-family:'Fraunces',serif; color:#0f172a; }
.kpi-tile .sub{ font-size:11px; color:#94a3b8; margin-top:2px; }

/* ── PAGINATION ── */
.exp-pagination{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    padding:12px 16px;
    border-top:1px solid #f1f5f9;
    background:#fafafa;
}
.exp-pagination .pg-info{ font-size:12.5px; color:#64748b; font-family:'DM Mono',monospace; }
.pg-controls{ display:flex; align-items:center; gap:6px; }
.pg-btn{
    min-width:32px; height:32px; padding:0 9px;
    border:1px solid #e2e8f0; border-radius:7px;
    background:#fff; font-size:12.5px; font-weight:600;
    color:#0f172a; cursor:pointer; transition:.15s;
    display:inline-flex; align-items:center; justify-content:center;
    font-family:'DM Sans',sans-serif;
}
.pg-btn:hover:not(:disabled){ background:#f1f5f9; }
.pg-btn.active{ background:#0f172a; color:#fff; border-color:#0f172a; }
.pg-btn:disabled{ opacity:.35; cursor:not-allowed; }
.pg-ellipsis{ font-size:12.5px; color:#94a3b8; padding:0 3px; user-select:none; }

/* ── TOAST ── */
.exp-toast{
    position:fixed; bottom:24px; right:24px;
    padding:13px 20px; border-radius:12px;
    font-size:14px; font-weight:700; color:#fff;
    opacity:0; transform:translateY(10px);
    transition:.3s ease; z-index:9999; pointer-events:none;
    font-family:'DM Sans',sans-serif;
}
.exp-toast.show{ opacity:1; transform:translateY(0); }
.exp-toast.success{ background:#16a34a; }
.exp-toast.error  { background:#dc2626; }
</style>

<div class="exp-wrap">

<!-- TERM BANNER -->
<div class="term-banner" id="termBanner">
    <div>
        <h2>Expense Tracking</h2>
        <span id="termLabel">Loading term…</span>
    </div>
    <span class="term-pill none" id="termPill">—</span>
</div>

<!-- KPI STRIP -->
<div class="kpi-strip" id="kpiStrip">
    <div class="kpi-tile"><div class="skeleton" style="width:60%;margin-bottom:8px"></div><div class="skeleton" style="width:80%"></div></div>
    <div class="kpi-tile"><div class="skeleton" style="width:60%;margin-bottom:8px"></div><div class="skeleton" style="width:80%"></div></div>
    <div class="kpi-tile"><div class="skeleton" style="width:60%;margin-bottom:8px"></div><div class="skeleton" style="width:80%"></div></div>
    <div class="kpi-tile"><div class="skeleton" style="width:60%;margin-bottom:8px"></div><div class="skeleton" style="width:80%"></div></div>
</div>

<div class="exp-grid">

    <!-- ══ ADD EXPENSE ══ -->
    <div class="exp-card">
        <div class="exp-card-head">
            <h3>➕ Add Expense</h3>
            <span id="addLockNote" style="font-size:11px;color:#ef4444;display:none">🔒 Term locked</span>
        </div>
        <div class="exp-card-body">
            <div class="exp-form" id="addForm">
                <div>
                    <label>Title</label>
                    <input class="exp-input" id="expTitle" placeholder="e.g. Teacher salaries">
                </div>
                <div class="exp-row">
                    <div>
                        <label>Category</label>
                        <select class="exp-input" id="expCategory">
                            <option value="Salaries">Salaries</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Supplies">Supplies</option>
                            <option value="Maintenance">Maintenance</option>
                            <option value="Transport">Transport</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div>
                        <label>Amount (UGX)</label>
                        <input class="exp-input" id="expAmount" type="number" min="1" placeholder="0">
                    </div>
                </div>
                <div class="exp-row">
                    <div>
                        <label>Date</label>
                        <input class="exp-input" id="expDate" type="date">
                    </div>
                    <div>
                        <label>Payment Method</label>
                        <select class="exp-input" id="expMethod">
                            <option value="Cash">Cash</option>
                            <option value="Bank">Bank Transfer</option>
                            <option value="Mobile Money">Mobile Money</option>
                            <option value="Cheque">Cheque</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label>Status</label>
                    <select class="exp-input" id="expStatus">
                        <option value="Approved">Approved</option>
                        <option value="Pending">Pending</option>
                    </select>
                </div>
                <button class="exp-btn primary" id="addExpBtn" onclick="submitExpense()">Save Expense</button>
            </div>
        </div>
    </div>

    <!-- ══ EXPENSE HISTORY ══ -->
    <div class="exp-card">
        <div class="exp-card-head">
            <h3>📋 Expense History</h3>
        </div>
        <div class="exp-card-body" style="padding-bottom:0">
            <div class="hist-bar">
                <select class="exp-input" id="histYear" onchange="resetExpPage()">
                    <option value="">All Years</option>
                </select>
                <select class="exp-input" id="histTerm" onchange="resetExpPage()">
                    <option value="">All Terms</option>
                    <option value="Term 1">Term 1</option>
                    <option value="Term 2">Term 2</option>
                    <option value="Term 3">Term 3</option>
                </select>
                <select class="exp-input" id="histCat" onchange="resetExpPage()">
                    <option value="">All Categories</option>
                    <option value="Salaries">Salaries</option>
                    <option value="Utilities">Utilities</option>
                    <option value="Supplies">Supplies</option>
                    <option value="Maintenance">Maintenance</option>
                    <option value="Transport">Transport</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="exp-table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Amount</th>
                            <th>Date</th>
                            <th>Term</th>
                            <th>Status</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="histTbody">
                        <tr><td colspan="7" class="no-data">Loading…</td></tr>
                    </tbody>
                </table>
            </div>
            <!-- PAGINATION -->
            <div class="exp-pagination" id="expPagination" style="display:none">
                <span class="pg-info" id="expPgInfo"></span>
                <div class="pg-controls" id="expPgControls"></div>
            </div>
        </div>
    </div>

</div><!-- /exp-grid -->
</div><!-- /exp-wrap -->

<div class="exp-toast" id="toast"></div>

<script>
const fmt = n => "UGX " + Number(n || 0).toLocaleString();
let termStatus    = "none";
let currentTermId = null;
let expPage       = 1;

function showToast(msg, type = "success"){
    const t = document.getElementById("toast");
    t.textContent = msg; t.className = `exp-toast ${type} show`;
    setTimeout(() => t.classList.remove("show"), 3600);
}

// ── PAGINATION HELPERS ─────────────────────────────────────────────
function buildPageNumbers(current, total){
    if (total <= 7) return Array.from({length: total}, (_, i) => i + 1);
    const pages = [1];
    if (current > 3) pages.push("…");
    for (let i = Math.max(2, current - 1); i <= Math.min(total - 1, current + 1); i++){
        pages.push(i);
    }
    if (current < total - 2) pages.push("…");
    pages.push(total);
    return pages;
}

function renderExpPagination(p){
    const bar      = document.getElementById("expPagination");
    const info     = document.getElementById("expPgInfo");
    const controls = document.getElementById("expPgControls");

    if (p.pages <= 1){ bar.style.display = "none"; return; }
    bar.style.display = "flex";

    const start = (p.page - 1) * p.per_page + 1;
    const end   = Math.min(p.page * p.per_page, p.total);
    info.textContent = `${start}–${end} of ${p.total}`;

    controls.innerHTML = "";
    const mkBtn = (label, page, disabled, active) => {
        const b = document.createElement("button");
        b.className   = "pg-btn" + (active ? " active" : "");
        b.textContent = label;
        b.disabled    = disabled;
        if (!disabled) b.addEventListener("click", () => goExpPage(page));
        return b;
    };

    controls.appendChild(mkBtn("←", p.page - 1, p.page === 1, false));
    buildPageNumbers(p.page, p.pages).forEach(item => {
        if (item === "…"){
            const el = document.createElement("span");
            el.className = "pg-ellipsis"; el.textContent = "…";
            controls.appendChild(el);
        } else {
            controls.appendChild(mkBtn(item, item, false, item === p.page));
        }
    });
    controls.appendChild(mkBtn("→", p.page + 1, p.page === p.pages, false));
}

function goExpPage(page){
    expPage = page;
    loadHistory();
    document.querySelector(".exp-card:last-child").scrollIntoView({behavior:"smooth", block:"start"});
}

function resetExpPage(){
    expPage = 1;
    loadHistory();
}

// ── INIT ──────────────────────────────────────────────────────────
async function init(){
    await loadTermInfo();
    await Promise.all([loadKpis(), loadHistory(), loadYears()]);
}

async function loadTermInfo(){
    try {
        const res  = await fetch("/finance/api/expenses/term-info");
        const data = await res.json();
        termStatus    = data.status || "none";
        currentTermId = data.term_id || null;

        const label = document.getElementById("termLabel");
        const pill  = document.getElementById("termPill");

        label.textContent = data.term_name
            ? `${data.term_name} · ${data.year_name || ""}`
            : "No active term";

        if (termStatus === "active"){
            pill.textContent = "ACTIVE";
            pill.className   = "term-pill active";
        } else if (termStatus === "locked"){
            pill.textContent = "LOCKED";
            pill.className   = "term-pill locked";
            lockForm();
        } else {
            pill.textContent = "NO TERM";
            pill.className   = "term-pill none";
            lockForm();
        }
    } catch(e){ console.error(e); }
}

function lockForm(){
    ["expTitle","expCategory","expAmount","expDate","expMethod","expStatus","addExpBtn"]
        .forEach(id => {
            const el = document.getElementById(id);
            if (el) el.disabled = true;
        });
    document.getElementById("addLockNote").style.display = "inline";
}

async function loadKpis(){
    try {
        const res = await fetch("/finance/api/expenses/kpis");
        const d   = await res.json();
        document.getElementById("kpiStrip").innerHTML = `
            <div class="kpi-tile">
                <div class="label">This Term</div>
                <div class="val">${fmt(d.this_term)}</div>
                <div class="sub">total expenses</div>
            </div>
            <div class="kpi-tile">
                <div class="label">This Month</div>
                <div class="val">${fmt(d.this_month)}</div>
                <div class="sub">expenses</div>
            </div>
            <div class="kpi-tile">
                <div class="label">Pending</div>
                <div class="val">${fmt(d.pending)}</div>
                <div class="sub">awaiting approval</div>
            </div>
            <div class="kpi-tile">
                <div class="label">Transactions</div>
                <div class="val">${d.count}</div>
                <div class="sub">this term</div>
            </div>`;
    } catch(e){}
}

async function loadYears(){
    try {
        const res  = await fetch("/finance/api/expenses/years");
        const data = await res.json();
        const sel  = document.getElementById("histYear");
        data.years.forEach(y => {
            const o = document.createElement("option");
            o.value = y; o.textContent = y; sel.appendChild(o);
        });
    } catch(e){}
}

async function loadHistory(){
    const year  = document.getElementById("histYear").value;
    const term  = document.getElementById("histTerm").value;
    const cat   = document.getElementById("histCat").value;
    const tbody = document.getElementById("histTbody");
    tbody.innerHTML = `<tr><td colspan="7" class="no-data">Loading…</td></tr>`;
    document.getElementById("expPagination").style.display = "none";

    const params = new URLSearchParams({page: expPage});
    if (year) params.append("year", year);
    if (term) params.append("term", term);
    if (cat)  params.append("category", cat);

    try {
        const res  = await fetch("/finance/api/expenses?" + params);
        const data = await res.json();

        if (!data.expenses.length){
            tbody.innerHTML = `<tr><td colspan="7" class="no-data">No expenses found.</td></tr>`;
            renderExpPagination(data.pagination || {page:1,per_page:20,total:0,pages:1});
            return;
        }

        tbody.innerHTML = data.expenses.map(e => `
            <tr>
                <td>
                    <strong>${e.title}</strong><br>
                    <span style="font-size:11px;color:#94a3b8">${e.payment_method || ""}</span>
                </td>
                <td><span class="cat-badge cat-${e.category}">${e.category}</span></td>
                <td style="font-weight:700">${fmt(e.amount)}</td>
                <td style="font-family:'DM Mono',monospace;font-size:12px">${e.date}</td>
                <td style="font-size:12px">${e.term_name || ""} ${e.year_name || ""}</td>
                <td><span class="status-badge status-${e.status}">${e.status}</span></td>
                <td>${e.can_delete
                    ? `<button class="exp-btn danger" style="height:30px;padding:0 10px;font-size:12px" onclick="deleteExpense(${e.id})">Delete</button>`
                    : ""}</td>
            </tr>`).join("");

        renderExpPagination(data.pagination);

    } catch(e){
        tbody.innerHTML = `<tr><td colspan="7" class="no-data">Failed to load.</td></tr>`;
    }
}

async function submitExpense(){
    if (termStatus !== "active"){ showToast("No active term", "error"); return; }

    const title  = document.getElementById("expTitle").value.trim();
    const cat    = document.getElementById("expCategory").value;
    const amount = parseFloat(document.getElementById("expAmount").value);
    const date   = document.getElementById("expDate").value;
    const method = document.getElementById("expMethod").value;
    const status = document.getElementById("expStatus").value;

    if (!title || !amount || !date){
        showToast("Fill in title, amount and date.", "error"); return;
    }

    const btn = document.getElementById("addExpBtn");
    btn.disabled = true; btn.textContent = "Saving…";

    try {
        const res  = await fetch("/finance/api/expenses", {
            method:  "POST",
            headers: {"Content-Type": "application/json"},
            body:    JSON.stringify({title, category: cat, amount, date, payment_method: method, status}),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Failed");
        showToast("Expense saved!");
        ["expTitle","expAmount","expDate"].forEach(id => document.getElementById(id).value = "");
        expPage = 1;
        await Promise.all([loadKpis(), loadHistory()]);
    } catch(e){
        showToast(e.message, "error");
    } finally {
        btn.disabled = false; btn.textContent = "Save Expense";
    }
}

async function deleteExpense(id){
    if (!confirm("Delete this expense?")) return;
    try {
        const res  = await fetch(`/finance/api/expenses/${id}`, {method: "DELETE"});
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Failed");
        showToast("Deleted.");
        // stay on current page; if it empties drop back one
        await Promise.all([loadKpis(), loadHistory()]);
    } catch(e){ showToast(e.message, "error"); }
}

// set today as default date
document.getElementById("expDate").value = new Date().toISOString().split("T")[0];

init();
</script>
{% endblock %}
